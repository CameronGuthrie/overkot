<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;">
  <title>Changelog</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="icons.css">
  <script src="ui-icons.js" defer></script>
  <style>
    html {
      overflow: hidden !important;
      height: 100%;
    }
    body {
      background: var(--bg-panel) !important;
      overflow: hidden !important;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #changelog-body {
      padding: 12px;
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .changelog-entry {
      border: 1px solid rgba(100, 100, 100, 0.25);
      border-radius: 5px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: rgba(40, 40, 40, 0.5);
    }
    .changelog-entry.featured {
      background: rgba(50, 60, 80, 0.45);
      border-color: var(--accent-blue, #87CEFA);
    }
    .changelog-entry-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .changelog-version {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .changelog-badge {
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 8px;
      background: var(--accent-blue, #87CEFA);
      color: #000;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .changelog-changes {
      list-style: none;
      padding-left: 4px;
      margin: 0;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-secondary, #ccc);
    }
    .changelog-changes li::before {
      content: '•';
      margin-right: 6px;
      color: var(--text-muted, #888);
    }
    .changelog-previous {
      margin-top: 4px;
    }
    .changelog-toggle {
      background: none;
      border: 1px solid rgba(100, 100, 100, 0.25);
      border-radius: 4px;
      color: var(--text-muted, #888);
      font-size: 12px;
      padding: 6px 10px;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .changelog-toggle:hover {
      background: rgba(60, 60, 60, 0.5);
      color: var(--text-primary);
    }
    .changelog-toggle-arrow {
      display: inline-block;
      font-size: 10px;
      margin-right: 4px;
      transition: transform 0.15s ease;
    }
    .changelog-previous-list {
      margin-top: 8px;
      max-height: 300px;
      overflow-y: auto;
    }
    .changelog-previous-list .changelog-entry {
      background: rgba(35, 35, 35, 0.4);
    }
    .changelog-empty {
      color: var(--text-muted, #888);
      text-align: center;
      padding: 20px;
    }
  </style>
  <link rel="stylesheet" href="theme.css">
  <script src="../modules/appearance.js"></script>
  <script src="motion.js"></script>
  <script src="theme.js"></script>
</head>
<body>
  <!-- Custom titlebar -->
  <div id="titlebar" class="drag-region">
    <span id="changelog-title" class="title-text" style="font-size:14px;">Changelog - Overkot</span>
    <div class="titlebar-spacer"></div>
    <button id="close-btn" class="titlebar-btn no-drag" title="Close"><span class="icon-close"></span></button>
  </div>

  <!-- Changelog content -->
  <div id="changelog-body" class="changelog-body"></div>

  <script src="shared-constants.js"></script>
  <script src="changelog-window.js"></script>
</body>
</html>
