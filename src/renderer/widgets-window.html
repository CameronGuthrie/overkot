<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;">
  <title>Widgets</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="icons.css">
  <script src="ui-icons.js" defer></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="widgets-window.css">
  <script src="../modules/appearance.js"></script>
  <script src="motion.js"></script>
  <script src="theme.js"></script>
</head>
<body>
  <!-- Custom titlebar -->
  <div id="titlebar" class="drag-region">
    <span class="icon-widgets titlebar-icon" aria-hidden="true"></span>
    <span id="widgets-title" class="title-text">Widgets</span>
    <div class="titlebar-spacer"></div>
    <button id="close-btn" class="titlebar-btn no-drag" title="Close" aria-label="Close"><span class="icon-close" aria-hidden="true"></span></button>
  </div>

  <div class="widgets-toolbar">
    <label class="widgets-search-field">
      <span class="icon-search" aria-hidden="true"></span>
      <input id="widgets-search" type="search" placeholder="Search widgets" aria-label="Search widgets" autocomplete="off" spellcheck="false">
    </label>
    <span id="widgets-count" aria-live="polite" aria-atomic="true"></span>
  </div>
  <main id="widgets-scroll" aria-labelledby="widgets-title">
    <div id="widgets-body"></div>
    <p id="widgets-empty" role="status" hidden>No widgets match your search.</p>
  </main>
  <footer class="widgets-footer">
    <p id="widgets-hint" class="widgets-hint"></p>
    <div id="widgets-feedback" hidden>
      <span id="widgets-status" role="status" aria-live="polite"></span>
      <button id="widgets-retry" type="button" hidden>Retry</button>
    </div>
    <span class="widgets-resize-grip" aria-hidden="true"></span>
  </footer>

  <script src="shared-constants.js"></script>
  <script src="widget-icons.js"></script>
  <script src="widgets-window.js"></script>
</body>
</html>
