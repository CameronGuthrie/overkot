<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self';">
  <title>Overkot focus reminder</title>
  <link rel="stylesheet" href="focus-reminder.css">
</head>
<body>
  <aside id="focus-reminder" role="status" aria-live="polite" data-edge="bottom">
    <div class="reminder-bubble">
      <img src="../../assets/overkot.png" alt="" width="32" height="32">
      <div class="reminder-copy">
        <strong>Your overlay is ready</strong>
        <p id="focus-message">Press <kbd id="focus-hotkey">Shift + F1</kbd> to focus</p>
        <small id="focus-detail">Change your shortcut in Settings → Overlay.</small>
      </div>
    </div>
  </aside>
  <script src="focus-reminder.js"></script>
</body>
</html>
