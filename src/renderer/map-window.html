<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: overkot-map-tiles:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;">
  <title>Midrath - World Map</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="icons.css">
  <script src="ui-icons.js" defer></script>
  <style>
    body {
      background: #0f0f1a !important;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    #titlebar {
      background: rgba(15, 15, 30, 0.95) !important;
      border-bottom: 1px solid rgba(60, 60, 90, 0.4);
    }

    #map-container {
      position: absolute;
      top: 32px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      cursor: grab;
    }

    #map-container:active {
      cursor: grabbing;
    }

    #map-canvas {
      position: absolute;
      top: 0;
      left: 0;
      image-rendering: auto;
    }

    /* Zoom controls */
    .map-controls {
      position: absolute;
      bottom: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }

    .map-ctrl-btn {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(60, 60, 90, 0.6);
      border-radius: 6px;
      background: rgba(20, 20, 40, 0.92);
      color: #d0d0e0;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.15s;
      user-select: none;
    }

    .map-ctrl-btn:hover {
      background: rgba(40, 40, 70, 0.95);
    }

    .map-ctrl-btn:disabled {
      opacity: .45;
      cursor: default;
    }

    /* Coordinate readout */
    .map-coord-readout {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(15, 15, 30, 0.92);
      border: 1px solid rgba(60, 60, 90, 0.4);
      border-radius: 6px;
      padding: 4px 10px;
      color: #a0a0c0;
      font-family: var(--font-mono, monospace);
      font-size: 12px;
      z-index: 10;
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Loading overlay */
    .map-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 15, 30, 0.9);
      color: #a0a0c0;
      font-size: 14px;
      z-index: 20;
      transition: opacity 0.3s;
    }

    .map-loading.loaded {
      opacity: 0;
      pointer-events: none;
    }

    /* POI hover tooltip */
    .map-tooltip {
      position: absolute;
      padding: 4px 10px;
      background: rgba(15, 15, 30, 0.94);
      border: 1px solid rgba(80, 80, 120, 0.5);
      border-radius: 5px;
      color: #d0d0e0;
      font-family: var(--font-ui, system-ui);
      font-size: 12px;
      width: max-content;
      max-width: calc(100% - 8px);
      white-space: pre-line;
      overflow-wrap: anywhere;
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      transition: opacity 0.12s;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .map-tooltip.visible {
      opacity: 1;
    }

    /* ── Legend Panel ────────────────────────────── */
    .map-legend-panel {
      position: absolute;
      bottom: 60px;
      right: 16px;
      width: 220px;
      max-height: calc(100% - 100px);
      overflow-y: auto;
      background: rgba(15, 15, 30, 0.94);
      border: 1px solid rgba(60, 60, 90, 0.5);
      border-radius: 8px;
      padding: 10px 12px;
      z-index: 15;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      gap: 2px;
    }

    .map-legend-panel.open {
      display: flex;
    }

    .map-legend-title {
      color: #d0d0e0;
      font-family: var(--font-ui, system-ui);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(60, 60, 90, 0.4);
    }

    .map-legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 4px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s;
    }

    .map-legend-row:hover {
      background: rgba(60, 60, 90, 0.3);
    }

    .map-legend-row.hidden-cat {
      opacity: 0.4;
    }

    .map-legend-icon {
      width: 20px;
      height: 20px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .map-legend-label {
      color: #c0c0d8;
      font-family: var(--font-ui, system-ui);
      font-size: 12px;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .map-legend-eye {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      opacity: 0.7;
      transition: opacity 0.12s;
    }

    .map-legend-row:hover .map-legend-eye {
      opacity: 1;
    }

    .map-legend-row.hidden-cat .map-legend-eye {
      opacity: 0.3;
    }

  </style>
  <link rel="stylesheet" href="theme.css">
  <script src="../modules/appearance.js"></script>
  <script src="motion.js"></script>
  <script src="theme.js"></script>
</head>
<body>
  <!-- Custom titlebar -->
  <div id="titlebar" class="drag-region" style="padding: 4px 8px; gap: 6px;">
    <span id="world-map-title" class="title-text" style="font-size:14px;">Midrath - World Map</span>
    <div class="titlebar-spacer"></div>
    <button id="close-btn" class="titlebar-btn no-drag" title="Close"><span class="icon-close"></span></button>
  </div>

  <div id="map-container">
    <canvas id="map-canvas"></canvas>
    <div class="map-loading" id="map-loading">
      <span id="map-tile-status" role="status">Loading map tiles…</span>
      <button class="map-connect-btn no-drag" id="map-connect" type="button" aria-describedby="map-tile-status" hidden></button>
    </div>
    <div class="map-controls">
      <button class="map-ctrl-btn no-drag" id="zoom-in-btn" title="Zoom in">+</button>
      <button class="map-ctrl-btn no-drag" id="zoom-out-btn" title="Zoom out">−</button>
      <button class="map-ctrl-btn no-drag" id="zoom-fit-btn" title="Fit to view">⊡</button>
      <button class="map-ctrl-btn no-drag" id="center-player-btn" title="Waiting for live player position" aria-label="Waiting for live player position" disabled><span class="icon-map-pin"></span></button>
      <button class="map-ctrl-btn no-drag" id="legend-btn" title="Map Legend"><span class="icon-eye"></span></button>
    </div>
    <div class="map-legend-panel" id="map-legend-panel">
      <div class="map-legend-title" id="map-legend-title">Map Legend</div>
    </div>
    <div class="map-coord-readout" id="coord-readout">X: — Z: —</div>
    <div class="map-tooltip" id="map-tooltip"></div>
  </div>

  <script src="shared-constants.js"></script>
  <script src="ancestor-markers.js"></script>
  <script src="world-drop-markers.js"></script>
  <script src="map-pois.js"></script>
  <script src="../modules/playerMarkerMotion.js"></script>
  <script src="../modules/mapAppearance.js"></script>
  <script src="map-window.js"></script>
</body>
</html>
