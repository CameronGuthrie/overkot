<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer Alert</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-ui, system-ui);
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    .alert-card {
      background: rgba(20, 20, 22, 0.96);
      border: 1px solid #4caf50;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slide-in 0.35s ease-out;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .alert-icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(76, 175, 80, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4caf50;
      font-size: 18px;
      font-weight: bold;
    }

    .alert-body {
      flex: 1;
      min-width: 0;
    }

    .alert-name {
      font-weight: 600;
      font-size: 14px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .alert-label {
      font-size: 11px;
      color: #4caf50;
      margin-top: 2px;
    }

    .alert-close {
      -webkit-app-region: no-drag;
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      color: #aaa;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .alert-close:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }

    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 8px;
      right: 8px;
      height: 2px;
      border-radius: 1px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: #4caf50;
      width: 100%;
      transform: scaleX(1);
      transform-origin: left center;
      will-change: transform;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateX(40px); }
      to   { opacity: 1; transform: translateX(0); }
    }

  </style>
  <link rel="stylesheet" href="theme.css">
  <script src="../modules/appearance.js"></script>
  <script src="motion.js"></script>
  <script src="theme.js"></script>
</head>
<body>
  <div class="alert-card" id="alert-card">
    <div class="alert-icon">✓</div>
    <div class="alert-body">
      <div class="alert-name" id="alert-name"></div>
      <div class="alert-label" id="alert-label">Ready</div>
    </div>
    <button class="alert-close" id="alert-close" type="button" title="Dismiss" aria-label="Dismiss alert">✕</button>
    <div class="progress-bar">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <script src="alert-window.js"></script>
</body>
</html>
