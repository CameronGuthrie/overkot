<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: overkot-map-tiles: overkot-game-data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;">
  <title data-i18n="dailyWidget">Daily Brief</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="icons.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="calendar-widget.css">
  <link rel="stylesheet" href="item-images.css">
  <link rel="stylesheet" href="daily-brief.css">
  <link rel="stylesheet" href="daily-brief-window.css">
  <script src="../modules/appearance.js"></script>
  <script src="motion.js"></script>
  <script src="theme.js"></script>
  <script src="ui-icons.js" defer></script>
  <script src="shared-constants.js" defer></script>
  <script src="../modules/gameDataImages.js" defer></script>
  <script src="item-images.js" defer></script>
  <script src="calendar-widget.js" defer></script>
  <script src="daily-brief.js" defer></script>
  <script src="daily-brief-window.js" defer></script>
</head>
<body class="daily-brief-window">
  <header id="titlebar" class="drag-region">
    <span class="icon-book-open" aria-hidden="true"></span>
    <span class="title-text" data-i18n="dailyWidget">Daily Brief</span>
    <span class="daily-popout-label" data-i18n="dailyWindowTagline">Your day in Soulframe</span>
    <div class="titlebar-spacer"></div>
    <button id="daily-minimize" class="titlebar-btn no-drag" type="button" data-i18n-label="dailyMinimizeWindow" title="Minimize Daily Brief" aria-label="Minimize Daily Brief"><span class="icon-minimize" aria-hidden="true"></span></button>
    <button id="daily-close" class="titlebar-btn no-drag" type="button" data-i18n-label="dailyCloseWindow" title="Close Daily Brief" aria-label="Close Daily Brief"><span class="icon-close" aria-hidden="true"></span></button>
  </header>
  <main id="daily-brief-content" data-i18n-label="dailyWidget" aria-label="Daily Brief"></main>
</body>
</html>
