name: Linux Mint and Debian test packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.repository_id == '1467149183' && github.ref_protected &&
      github.repository_owner_id == '76098008' &&
      github.actor_id == '76098008' &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    container: node:22-bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install --no-install-recommends -y build-essential clang zlib1g-dev libssl-dev cmake libx11-dev libarchive-tools libopenjp2-tools
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm run i18n:check
      - run: npm test
      - name: Build experimental amd64 DEB
        run: npm run build:deb -- --x64
      - name: Build portable x64 AppImage
        run: npm run build:linux:portable -- --x64
      - name: Save packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: overkot-linux-deb-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/overkot-*-linux-*.deb
            dist/overkot-*-linux-*.deb.sha256
            dist/overkot-*-linux-x86_64.AppImage
            dist/overkot-*-linux-x86_64.AppImage.sha256
